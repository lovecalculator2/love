<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Love Calculator</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pages-wrapper">
    <!-- PAGE 1 -->
    <div id="page1" class="page active">
        <div class="glass-card">
            <h1 class="title">Real Love Calculator</h1>
            <span class="love-emoji">❤️</span>

            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" class="form-input" id="userName" placeholder="Enter your name" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Your Love/Crush</label>
                <input type="text" class="form-input" id="loveName" placeholder="Enter crush name" autocomplete="off">
            </div>

            <button class="calculate-btn" id="calcBtn">❤️ Calculate ❤️</button>

            <div class="contact-section">
                <div class="contact-title">Contact Me</div>

                <div class="social-links">
                    <a href="https://www.instagram.com/gadmichael7" target="_blank" class="social-link instagram-link">
                        Instagram
                    </a>

                    <a href="https://www.tiktok.com/@gadmichael7" target="_blank" class="social-link tiktok-link">
                        TikTok
                    </a>
                </div>
            </div>

            <div class="footer">
                Built for lovers @2026 <span class="footer-heart">❤️</span>
            </div>
        </div>
    </div>

    <!-- PAGE 2 -->
    <div id="page2" class="page">
        <div class="glass-card">
            <h1 class="prank-title">You have been fooled by Gad</h1>

            <p class="prank-subtitle">
                Your name as well as name of your love has been sent to Gad
            </p>

            <span class="laugh-emoji">😂</span>
            <span class="laugh-tears">💦</span>

            <button class="back-btn" id="backBtn1">← Go Back</button>
        </div>
    </div>

    <!-- PAGE 3 -->
    <div id="page3" class="page">
        <div class="glass-card">
            <h1 class="admin-title">💘 Secret Crush Dashboard</h1>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Friend's Name</th>
                            <th>Love <span id="countBadge" class="count-badge">0</span></th>
                        </tr>
                    </thead>

                    <tbody id="adminTableBody">
                        <tr>
                            <td colspan="2" class="empty-msg">
                                No submissions yet...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="admin-nav">
                <button class="admin-nav-btn" id="backBtn2">← Back</button>
                <button class="admin-nav-btn" id="clearBtn">🗑️ Clear All</button>
            </div>
        </div>
    </div>
</div>

<!-- LOGIN -->
<div id="loginOverlay">
    <div class="glass-card login-box">
        <div class="login-title">🔒 Admin Access</div>

        <input type="password" class="login-input" id="adminPassword" placeholder="Enter password">

        <button class="login-btn" id="loginBtn">Unlock</button>

        <div class="login-error" id="loginError">
            Wrong password!
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
